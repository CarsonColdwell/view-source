<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My View Source Project</title>

<style>
  body {
      font-family: Helvetica, Arial, sans-serif;
      background-color: black;
      color: white;
      margin: 40px;
      overflow-x: hidden;
  }

  .x-wrapper {
    position: relative;
    height: 700px;
    margin-top: 100px;
    margin-bottom: 100px;
  }

  .x-text {
    position: absolute;
    font-size: 400px;
    letter-spacing: 20px;
    font-weight: bold;
    margin: 0;
    white-space: nowrap;

    left: 50%;
    top: 50%;
    transform-origin: center;
  }

  .piracy {
    transform: translate(-50%, -50%) rotate(35deg);
    color: #ff3333;
  }

  .stealing {
    transform: translate(-50%, -50%) rotate(-35deg);
    color: #3388ff;
    mix-blend-mode: screen;
  }

  .offset {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) rotate(-4deg);

    font-size: 120px;
    font-weight: bold;
    text-align: center;
    margin: 0;
  }

  .top-isnt {
    top: 120px;
  }

  .bottom-isnt {
    bottom: 120px;
  }
</style>
</head>

<body>

  <div class="x-wrapper">

    <h1 class="offset top-isnt">Isn't</h1>

    <h1 class="x-text piracy">PIRACY</h1>

    <h1 class="x-text stealing">STEALING</h1>

    <h1 class="offset bottom-isnt">Isn't</h1>

  </div>

</body>
</html>
