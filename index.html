<!DOCTYPE html>
<html lang"en">

<head>
  <meta charset="utf-8">
  <title>My View Source Project</title>

<style>
  body {
      font-family: Helvetica, Arial, sans-serif;
      background-color: black;
      color: white;
      margin: 40px;
      overflow-x: hidden;
  }

  div {
    font-size: 120px
    font-weight: bold;
    magin-top: 30px
    margin-bottom: 30px;
  }

  .x-wrapper {
    position: relative;
    height: 700px;
    margin-top: 100px;
    margin-bottom: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .x-text {
    position: absolute;
    font-size: 400px;
    letter-spacing: 20px;
    font-weight: bold;
    margin: 0;
    white-space: nowrap;
  }

  .piracy {
    transform: rotate(35deg);
    color: #ff3333;
  }

  .stealing {
    transform: rotate(-35deg);
    color: #3388ff;
    mix-blend-mode: screen;
  }

  .offset {
    margin-left: 180px;
    transform: rotate(-4deg);
  }
  
</style>
  
</head>

<body>
  <div>Isn't</div>

  <div class="x-wrapper">
    <h1 class="x-text piracy">PIRACY</h1>
    <h1 class="x-text stealing">STEALING</h1>
  </div>

   <div class="offset">Isn't</div>

</body>

</html>
